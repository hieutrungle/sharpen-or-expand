# The frozen evaluation suite (decision 004). v2 (decision 007): Level B text repaired (42 problems,
# same ids); every other file is byte-identical to v1. v1 stays in eval_suite_v1.yaml.
# Every checkpoint -- base, SFT, DPO, every RL run --
# is evaluated with exactly these settings. Never edit after the M0 freeze: a change needs a new
# decision note and a new suite name. Problem-set hashes come from the data build report below.
name: soe-eval-v2
data_build_report: docs/reports/m0_datasets_v2.json

# As in Yue et al. (2025), "Does Reinforcement Learning Really Incentivize Reasoning Capacity in
# LLMs Beyond the Base Model?": identical for base and RL models.
sampling:
  temperature: 0.6
  top_p: 0.95
  top_k: -1  # disabled
  max_tokens: 16384  # also the cap on RL rollout length (enforced from M1)
  seed: 0  # every request; the same random numbers for every checkpoint

# Zero-shot, the same prompt for every model stage, wrapped in the model's chat template.
# SFT data (M2) must use this format. Gemma 4 E4B base ships no chat template; M8 uses the one
# from google/gemma-4-E4B-it (same tokenizer).
prompt:
  use_chat_template: true
  # Generation prompt ends with an open "<think>\n" (decision 006); every renderer must pass this:
  # evaluation, verl rollouts (apply_chat_template kwargs) and the SFT data format.
  enable_thinking: true
  template: |-
    {problem}

    Please reason step by step, and put your final answer within \boxed{}.

scoring:
  answer_extraction: last_boxed  # no \boxed{} -> incorrect
  truncated_response: incorrect  # hit max_tokens; truncation rate is reported per set
  maj_grouping: verifier_equivalence
  transition_solved_threshold: 0.5  # solved at k when pass@k >= 0.5

main:  # every problem set: 16 samples per problem
  ks: [1, 4, 8, 16]
  transition_ks: [1, 16]  # k=1: reliably solved (sharpening); k=16: solved at least once (expansion)
hard:  # the hard subset: 64 samples per problem (its first 16 double as the main tier)
  ks: [1, 4, 8, 16, 32, 64]
  transition_ks: [1, 64]

