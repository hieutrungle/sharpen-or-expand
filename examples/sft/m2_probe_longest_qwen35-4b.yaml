# M2.8 worst-case probe (user, 2026-11-04): the first probe (m2_probe_qwen35-4b.yaml, job 3233371)
# left 1.1-2.6 GiB free per A40, under the 4 GiB margin. This one trains only on the 256 longest
# train examples (15,783-16,549 tokens; the train set's longest), so every micro-batch is near run
# #1's worst case, and the SFT workers now run with expandable segments (soe/trainer/main_sft.py).
# Same model, recipe, GPUs and validation as the first probe; 8 steps with saves at 4 and 8. The
# checkpoint is discarded; development only.
name: sft_m2_probe_longest_qwen35-4b
milestone: m2
development: true
lane: A
model:
  hf_id: Qwen/Qwen3.5-4B-Base
  revision: 1001bb4d826a52d1f399e183466143f4da7b741b
init_checkpoint: null  # SFT starts from the base model
training_mode: full_bf16  # the G0 mode (decision 025)
algorithm: sft
optim:
  learning_rate: 1.0e-5
  warmup_steps: 1  # 3% of max_steps, rounded up
  weight_decay: 0.0
sft:
  n_gpus: 4
  max_length: 18432  # 2,048 prompt + 16,384 response tokens (the evaluation cap)
  epochs: 1
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 8  # 32 sequences per optimizer step on 4 GPUs (D5)
  lr_scheduler: cosine
  save_every_steps: 4
  keep_last: 2
  max_steps: 8  # one epoch of the 256 examples
data:
  train_file: datasets/soe/v1/sft/dev_longest.jsonl  # examples/data_preprocess/m2_sft_longest.yaml
  train_sha256: c3099ee3fc15684308f51ee021a395cb1ae1dd34dea08d22a816519e843044e7
  val_file: datasets/soe/v1/sft/val.jsonl
  val_sha256: 48f248847bf265bd1f612b08b32081e1aba471712a9a1900e6f4e4e911aa09e1
eval_suite: soe/trainer/config/eval_suite.yaml
