# M1.10 check on 2xA40 (any A40 pair) that 4B LoRA gets past its first weight sync: verl 0.9.1
# crashed there in every B-L probe (decision 024). The B-L cell with 2 GPUs, 16 prompts and a
# 2,048-token response cap; run as a probe (2 steps) through slurm/memory_probe.sbatch.
name: m1_memory_smoke_bl_qwen35-4b
milestone: m1
development: true  # M1 measurements never enter conclusions
lane: A
model:
  hf_id: Qwen/Qwen3.5-4B-Base
  revision: 1001bb4d826a52d1f399e183466143f4da7b741b
init_checkpoint: null  # SFT changes lengths, not memory per token (docs/roadmap/M1.md, M1.10)
training_mode: lora_bf16
lora:
  rank: 64
  alpha: 128
  target_modules: all-linear
  exclude_modules: "(model\\.visual|mtp)\\..*"  # language model only
algorithm: grpo
optim:
  learning_rate: 1.0e-5  # not studied here; a plausible value for the mode
  warmup_steps: 10
  weight_decay: 0.0
rollout:
  prompts_per_step: 16
  group_size: 8
  updates_per_step: 4  # decision 022
  temperature: 1.0  # decision 017
  top_p: 1.0
  max_prompt_tokens: 2048  # longest RL prompt is 1,446 tokens (docs/reports/m1_rl_prompts.json)
  smoke_max_response_tokens: 2048  # a quick check of the pipeline, not of memory
policy_loss:
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  entropy_coef: 0.0
budget:
  rollout_tokens: 220000000  # upper bound only; max_steps ends the cell
  max_steps: 5  # 1 warm-up step + 4 measured steps (steps 2-5)
checkpoint:
  save_every_steps: 5  # one save, at the last step, so its time is measured too
  keep_last: 1
validation:  # D2 sizes; validated at step 0 and at the last step
  max_problems: 128
  samples_per_problem: 2
hardware:
  n_gpus: 2
  # Set from this cell's probes (slurm/memory_probe.sbatch, user 2026-10-31: descending search).
  rollout_tensor_parallel: 1
  gpu_memory_utilization: 0.6
  param_offload: false
  optimizer_offload: false
  max_token_len_per_gpu: 36864  # two full-length sequences (2 x (2,048 + 16,384))
  fused_log_prob: true  # no materialised logits in the log-prob pass (M1.8 note)
data:  # RL data v3.1 (decision 012; docs/reports/m1_datasets_v3.1.json)
  train_file: datasets/soe/v3.1/rl/verl/train.parquet
  train_sha256: 2ea38a35b7d5a1b8bfa8b2d85bc94e45996b7163934c6955618b8ca123d805d3
  val_file: datasets/soe/v3.1/rl/verl/val.parquet
  val_sha256: 92e97417fb22727127ed4ef4ca7e5c857841a9cec9d579c23f66bd1722754e0f
eval_suite: soe/trainer/config/eval_suite.yaml
