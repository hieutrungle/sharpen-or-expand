# M2.14: 4B RL smoke from the frozen start (decision 031), the M3 configuration on fc098.
# The decision-025 shared 4B base config (from m1_throughput_bf0_qwen35-4b.yaml) with D8's
# learning rate, warmup and weight decay (lr 1e-6 constant after 10 warmup steps, wd 0.1; user
# 2026-11-03), stopped by a rollout-token budget of about 6 steps (M1.11 measured 4.65M rollout
# tokens per step from the base) with a save every 2 steps, so train_to_stop re-estimates the stop
# step twice. First GPU use of train_to_stop; also checks G0's revisit triggers.
name: m2_rl_smoke_qwen35-4b
milestone: m2
development: true  # a smoke: never in conclusions
lane: A
model:  # the frozen start (soe/trainer/config/frozen_start.yaml); the launch checks its digest
  hf_id: Qwen/Qwen3.5-4B-Base
  revision: 1001bb4d826a52d1f399e183466143f4da7b741b
init_checkpoint: null  # decision 031
training_mode: full_bf16  # decision 025
algorithm: grpo
optim:  # D8 (a), decision 025 revision in M2.15
  learning_rate: 1.0e-6
  warmup_steps: 10
  weight_decay: 0.1
rollout:
  prompts_per_step: 64
  group_size: 8
  updates_per_step: 4  # decision 022
  temperature: 1.0  # decision 017
  top_p: 1.0
  max_prompt_tokens: 2048  # longest RL prompt is 1,446 tokens (docs/reports/m1_rl_prompts.json)
policy_loss:
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  entropy_coef: 0.0
budget:
  rollout_tokens: 28000000  # about 6 steps at 4.65M rollout tokens per step (M1.11)
checkpoint:
  save_every_steps: 2  # the stop step is re-estimated at steps 2 and 4
  keep_last: 2  # as real runs (decision 025)
validation:  # D2 sizes, at step 0 and at every save, as real runs
  max_problems: 128
  samples_per_problem: 2
hardware:  # decision 025 (M1.10 probes: TP 1 at 0.7)
  n_gpus: 4
  rollout_tensor_parallel: 1
  gpu_memory_utilization: 0.7
  param_offload: false
  optimizer_offload: false
  max_token_len_per_gpu: 36864  # two full-length sequences (2 x (2,048 + 16,384))
  fused_log_prob: true
data:  # RL data v3.1 (decision 012; docs/reports/m1_datasets_v3.1.json)
  train_file: datasets/soe/v3.1/rl/verl/train.parquet
  train_sha256: 2ea38a35b7d5a1b8bfa8b2d85bc94e45996b7163934c6955618b8ca123d805d3
  val_file: datasets/soe/v3.1/rl/verl/val.parquet
  val_sha256: 92e97417fb22727127ed4ef4ca7e5c857841a9cec9d579c23f66bd1722754e0f
eval_suite: soe/trainer/config/eval_suite.yaml
