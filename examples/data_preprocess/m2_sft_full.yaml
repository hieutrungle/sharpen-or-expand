# M2.5 full sampling (roadmap D1 (c), D3, D4): the pilot's settings and permutation, continued from
# problem 1,000 to 16,000 (size fixed in M2.4 from the pilot's yield). The build uses the pilot's
# samples (m2_sft_pilot.yaml) for [0, 1000) and these for the rest.
version: m2-sft-full-v1
suite: soe/trainer/config/eval_suite.yaml  # soe-eval-v4
model: Qwen/Qwen3.5-4B-Base  # revision pinned in scripts/stage_assets.yaml
problems: datasets/soe/v1/sft/pool_clean.jsonl
problems_sha256: 87d55db66a7900aeabdeef3325e13e24f1bc54baca5456a55a1ca991a7949273
meta: datasets/soe/v1/sft/pool_meta.jsonl
draw_seed: 20261103
draw_start: 1000
draw_stop: 16000
samples_per_problem: 4
max_kept_per_problem: 2
sampling_seed: 2
num_shards: 60  # 250 problems each (about 1 h on an A30); 1-GPU workers claim shards
work_dir: samples/m2_sft_full
