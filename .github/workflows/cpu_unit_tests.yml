name: cpu_unit_tests

on:
  push:
  pull_request:

jobs:
  cpu_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (locked, CPU deps only)
        run: uv sync --locked
      # Same rule as verl: every tests/**/test_*_on_cpu.py runs here; GPU tests run on FASTER.
      - name: Tests
        run: uv run pytest -q $(find tests -name 'test_*_on_cpu.py' | sort)
