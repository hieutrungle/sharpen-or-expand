name: pre-commit

on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (locked, CPU deps only)
        run: uv sync --locked
      - name: ruff, ruff format, mypy
        run: uv run pre-commit run --all-files --show-diff-on-failure
